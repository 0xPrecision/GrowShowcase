name: Deploy to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Debug SSH (native -vvv)
        shell: bash
        env:
          KEY: ${{ secrets.VPS_KEY }}
        run: |
          set -euxo pipefail
          umask 077
          printf "%s\n" "$KEY" > id
          ssh -vvv -i id -p "${{ secrets.VPS_PORT }}" -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "echo connected && whoami && hostname && id"
          rm -f id

      - name: "Sanity: deploy script presence"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          timeout: 60s
          command_timeout: 30m
          script: |
            set -euxo pipefail
            sudo -n test -x /usr/local/bin/deploy_showcase.sh
            sudo -n ls -l /usr/local/bin/deploy_showcase.sh

      - name: "Sanity: docker perms"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          timeout: 60s
          command_timeout: 30m
          script: |
            set -euxo pipefail
            whoami
            id
            which docker || true
            docker --version || true
            # покажет, нужен ли sudo
            docker ps >/dev/null 2>&1 || echo "DOCKER_NEEDS_SUDO"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          timeout: 60s
          command_timeout: 30m
          script: |
            set -euxo pipefail
            sudo -n /usr/local/bin/deploy_showcase.sh



