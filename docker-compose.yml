version: "3.9"

services:
  web:
    build:
      context: .
    command: uvicorn web.main:app --host 0.0.0.0 --port ${PORT:-8000}
    env_file: .env
    ports:
      - "80:${PORT:-8000}"
    volumes:
      - app_data:/data
    depends_on:
      - bot
    restart: unless-stopped

  bot:
    build:
      context: .
    # если у тебя точка входа другая – поменяй
    command: python -m main
    env_file: .env
    volumes:
      - app_data:/data
    restart: unless-stopped

volumes:
  app_data:

